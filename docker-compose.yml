# =============================================================================
# Agent Trust Platform — compatibility/local stack
#
# Topology:
#   frontend-*    React apps served via Nginx  (ports 5173-5176)
#   api-*         FastAPI backends              (ports 8001-8004)
#   worker        Legacy Redis scan job processor
#   worker-platform PostgreSQL job-ledger worker
#   postgres      Scan result persistence
#   redis         Job queue + result cache
#
# Usage:
#   python3 scripts/configure_local.py   # fresh installs only; preserves existing files
#   docker compose up --build -d --wait
#
# The namespaced platform service is single-tenant and local/self-hosted.
# =============================================================================

x-api-common: &api-common
  restart: unless-stopped
  environment:
    AGENT_TRUST_HOSTED_ANALYSIS: ${AGENT_TRUST_HOSTED_ANALYSIS:-false}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    SECRET_KEY: ${SECRET_KEY:-change-me-local-only}
    SCAN_MODE: ${SCAN_MODE:-async}
    ALLOW_PRIVATE_COLLECTOR_TARGETS: ${ALLOW_PRIVATE_COLLECTOR_TARGETS:-false}
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://${POSTGRES_USER:-koi}:${POSTGRES_PASSWORD:?Retain existing credentials or run scripts/configure_local.py for a fresh install}@postgres:5432/${POSTGRES_DB:-koi_security}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Retain existing credentials or run scripts/configure_local.py for a fresh install}
      POSTGRES_DB: ${POSTGRES_DB:-koi_security}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The temporary initdb server accepts Unix sockets only. Do not release
      # dependents until the final TCP server is ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-koi} -d ${POSTGRES_DB:-koi_security}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Worker — async scan job processor
  # ---------------------------------------------------------------------------

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_TRUST_HOSTED_ANALYSIS: ${AGENT_TRUST_HOSTED_ANALYSIS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-local-only}
      SCAN_MODE: ${SCAN_MODE:-async}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-koi}:${POSTGRES_PASSWORD:?Retain existing credentials or run scripts/configure_local.py for a fresh install}@postgres:5432/${POSTGRES_DB:-koi_security}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API Services
  # ---------------------------------------------------------------------------

  api-blast:
    build:
      context: .
      dockerfile: app1-blast-radius/backend/Dockerfile
    <<: *api-common
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-baseline:
    build:
      context: .
      dockerfile: app2-behavior-baseline/backend/Dockerfile
    <<: *api-common
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/health\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-provenance:
    build:
      context: .
      dockerfile: app3-code-provenance/backend/Dockerfile
    <<: *api-common
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/health\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-scorecard:
    build:
      context: .
      dockerfile: app4-mcp-scorecard/backend/Dockerfile
    <<: *api-common
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/health\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Namespaced platform API and durable worker
  # -------------------------------------------------------------------------

  api-platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-koi}:${POSTGRES_PASSWORD:?Retain existing credentials or run scripts/configure_local.py for a fresh install}@postgres:5432/${POSTGRES_DB:-koi_security}
      AGENT_TRUST_API_TOKEN: ${AGENT_TRUST_API_TOKEN:?Run python3 scripts/configure_local.py first}
      AGENT_TRUST_AUTH_MODE: ${AGENT_TRUST_AUTH_MODE:-token}
      AGENT_TRUST_WORKSPACE_ID: ${AGENT_TRUST_WORKSPACE_ID:-local}
      AGENT_TRUST_ALLOWED_ORIGINS: ${AGENT_TRUST_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AGENT_TRUST_API_SCOPES: ${AGENT_TRUST_API_SCOPES:-read,write,assess}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  worker-platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    restart: unless-stopped
    command: ["agent-trust-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-koi}:${POSTGRES_PASSWORD:?Retain existing credentials or run scripts/configure_local.py for a fresh install}@postgres:5432/${POSTGRES_DB:-koi_security}
      AGENT_TRUST_API_TOKEN: ${AGENT_TRUST_API_TOKEN:?Run python3 scripts/configure_local.py first}
      AGENT_TRUST_AUTH_MODE: ${AGENT_TRUST_AUTH_MODE:-token}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Apps — Nginx-served React builds
  # ---------------------------------------------------------------------------

  frontend-blast:
    build:
      context: app1-blast-radius/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api-blast

  frontend-baseline:
    build:
      context: app2-behavior-baseline/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - api-baseline

  frontend-provenance:
    build:
      context: app3-code-provenance/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:5175"
    depends_on:
      - api-provenance

  frontend-scorecard:
    build:
      context: app4-mcp-scorecard/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5176:5176"
    depends_on:
      - api-scorecard

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

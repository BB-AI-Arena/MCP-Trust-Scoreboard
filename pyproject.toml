[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-platform"
version = "2.0.0a1"
description = "Vendor-neutral local/self-hosted security assessment and monitoring for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
providers = ["google-generativeai>=0.8,<1"]
test = ["pytest>=9,<10", "pytest-cov>=5,<6"]

[project.scripts]
agent-trust-api = "agent_trust.api.app:run"
agent-trust-worker = "agent_trust.jobs.worker:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

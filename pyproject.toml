[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-platform"
version = "2.0.0a1"
description = "Vendor-neutral local/self-hosted security assessment and monitoring for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
acceptance = ["playwright==1.62.0", "pypdf>=6,<7", "pillow>=12,<13", "PyYAML>=6,<7"]
postgres = ["psycopg[binary]>=3.1,<4"]
providers = ["google-generativeai>=0.8,<1"]
test = [
  "pytest>=9,<10",
  "pytest-cov>=5,<6",
  "networkx>=3,<4",
  "numpy>=2,<3",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
agent-trust-api = "agent_trust.api.app:run"
agent-trust-worker = "agent_trust.jobs.worker:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_trust.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: real Docker and PostgreSQL tests (enable with --run-integration)", "acceptance: actual Compose and browser acceptance (enable with --run-acceptance)"]

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**"]
  pull_request:
    branches: [main, "fix/**"]
  workflow_call:
    inputs:
      source_sha:
        description: Exact source to validate during manual release preparation
        required: true
        type: string

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Install and test
        shell: bash
        run: |
          python -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres,test]'
          pytest
          python -m compileall -q src tests
      - name: Check canonical version
        shell: bash
        run: |
          test "$(cat VERSION)" = "2.0.0-alpha.1"
          grep -q 'version = "2.0.0a1"' pyproject.toml
          for f in app1-blast-radius/frontend/package.json app2-behavior-baseline/frontend/package.json app3-code-provenance/frontend/package.json app4-mcp-scorecard/frontend/package.json; do
            test "$(node -p "require('./$f').version")" = "2.0.0-alpha.1"
          done

  runtime-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Test installed container and real PostgreSQL recovery
        run: |
          python -m venv .runtime-venv
          . .runtime-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres,test]'
          pytest --run-integration tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app1-blast-radius/frontend, app2-behavior-baseline/frontend, app3-code-provenance/frontend, app4-mcp-scorecard/frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Build frontend
        working-directory: ${{ matrix.app }}
        run: npm ci && node --test ../../tests/frontend/pdf-export.test.cjs && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Validate Compose configuration
        run: |
          python3 scripts/configure_local.py --output .ci.env
          docker compose --env-file .ci.env config --format json | python3 scripts/validate_deployment.py

  full-stack-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Real stack, browser downloads, upgrade and backup/restore
        run: |
          python -m venv .acceptance-venv
          . .acceptance-venv/bin/activate
          python -m pip install -e '.[postgres,test,acceptance]'
          python -m playwright install --with-deps chromium
          pytest --run-acceptance tests/acceptance -v --junitxml=evidence/acceptance/junit.xml
      - name: Retain traces, reports, image inventory and redacted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/acceptance
          retention-days: 14
          if-no-files-found: error

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Scan actual release images and generate CycloneDX inventories
        run: python3 scripts/scan_images.py
      - name: Retain complete findings and SBOMs even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/containers
          retention-days: 14
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Check committed files for common credential formats
        run: |
          if git grep -n -E 'AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----'; then
            echo 'Potential credential material found in tracked files' >&2
            exit 1
          fi
      - name: Audit Python dependencies
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[postgres,test]' pip-audit
          pip-audit
      - name: Audit frontend dependencies
        run: |
          audit_status=0
          for d in app1-blast-radius/frontend app2-behavior-baseline/frontend app3-code-provenance/frontend app4-mcp-scorecard/frontend; do
            (cd "$d" && npm ci --ignore-scripts && npm audit --audit-level=high) || audit_status=1
          done
          exit "$audit_status"

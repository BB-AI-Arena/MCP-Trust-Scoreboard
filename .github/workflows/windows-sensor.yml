name: Windows endpoint sensor
on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "chore/**"]
  pull_request:
    branches: [main, "feat/**", "fix/**", "test/**", "chore/**"]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  portable-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache-dependency-path: sensor/go.sum
      - run: cd sensor && go test ./internal/sensor -v -count=1
  windows-endpoint:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      SENSOR_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 verified
        with:
          go-version: '1.26.8'
          cache-dependency-path: sensor/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 verified
        with:
          python-version: '3.12'
      - name: Native Windows tests and self-contained build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/windows | Out-Null
          Push-Location sensor
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module verification failed' }
          go test ./internal/sensor -v -count=1 | Tee-Object ../evidence/windows/go-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          go build -trimpath -ldflags "-X github.com/BB-AI-Arena/MCP-Trust-Scoreboard/sensor/internal/sensor.Commit=$env:SENSOR_SOURCE_SHA" -o dist/agent-trust-sensor.exe ./cmd/agent-trust-sensor
          if ($LASTEXITCODE -ne 0) { throw 'Sensor build failed' }
          go build -trimpath -o dist/fixture-process.exe ./cmd/fixture-process
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
          go version -m -json dist/agent-trust-sensor.exe > ../evidence/windows/build-inventory.json
          go list -m -json all > ../evidence/windows/modules.json
          Pop-Location
      - name: Foreground Windows sensor and PostgreSQL acceptance
        shell: pwsh
        run: |
          python -m pip install -e '.[postgres,test]'
          if ($LASTEXITCODE -ne 0) { throw 'Platform installation failed' }
          ./scripts/windows_acceptance.ps1
      - name: SCM virtual-account service and PostgreSQL acceptance
        shell: pwsh
        run: ./scripts/windows_acceptance.ps1 -Service
      - name: Retain non-sensitive validation evidence (not publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/windows
          retention-days: 14
          if-no-files-found: error

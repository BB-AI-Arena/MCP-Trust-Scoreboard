name: Prepare release evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION value
        required: true
        type: string
      source_sha:
        description: Exact reviewed source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
      - name: Require exact commit and version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
  gates:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  prepare:
    needs: [validate, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - name: Verify and prepare local release manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --sha "$SOURCE_SHA" --output release-manifest.json
      - name: Show release notes and manifest summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sed -n '1,220p' "docs/releases/$RELEASE_VERSION.md"
          python3 -c 'import json; d=json.load(open("release-manifest.json")); print(d["version"], d["source_sha"], len(d["files"]), "files hashed")'
